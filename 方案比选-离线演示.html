* { box-sizing: border-box; }
body { margin: 0; padding: 0; font-family: 'PingFang SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f7f8fa; color: #1d2129; }

.scheme-comparison-page {
  display: flex;
  min-height: 100vh;
  background: #f7f8fa;
}

/* 顶部导航栏 */
.navbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 60px;
  background: #ffffff;
  border-bottom: 1px solid #e5e6eb;
  display: flex;
  align-items: center;
  padding: 0 16px;
  z-index: 100;
}
.navbar-left { display: flex; align-items: center; }
.logo { display: flex; align-items: center; gap: 12px; }
.logo-icon {
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
}
.logo-img { width: 100%; height: 100%; object-fit: contain; }
.logo-text {
  font-family: 'PingFang SC', sans-serif;
  font-size: 20px;
  color: #1d2129;
  font-weight: 400;
  font-style: italic;
}

.navbar-tabs {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  display: flex; gap: 32px;
}
.tab-item {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 8px;
  border-radius: 2px;
  cursor: pointer;
  color: #4e5969;
  font-size: 14px;
  transition: all 0.2s;
  border-bottom: 2px solid transparent;
}
.tab-item:hover { background: #f2f3f5; }
.tab-item.active { color: #165dff; border-bottom-color: #165dff; }
.tab-item svg { font-size: 14px; }

.navbar-right {
  margin-left: auto;
  display: flex; align-items: center; gap: 16px;
}
.project-name { font-size: 14px; color: #4e5969; text-align: right; }
.notification-btn {
  width: 36px; height: 36px;
  background: #f2f3f5;
  border-radius: 18px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: background 0.2s;
}
.notification-btn:hover { background: #e5e6eb; }
.avatar {
  border-radius: 100px;
  overflow: hidden;
  width: 36px; height: 36px;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }

/* 左侧菜单 */
.sidebar-sider {
  position: fixed;
  top: 60px; left: 0; bottom: 0;
  width: 220px;
  background: #ffffff;
  border-right: 1px solid #e5e6eb;
  z-index: 50;
  overflow-y: auto;
  transition: width 0.2s;
}
.sidebar-sider.collapsed { width: 48px; }
.sidebar-menu {
  padding: 8px 0;
}
.menu-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 20px;
  cursor: pointer;
  color: #1d2129;
  font-size: 14px;
  transition: all 0.2s;
  border-left: 3px solid transparent;
}
.menu-item:hover { background: #f2f3f5; }
.menu-item.active {
  background: rgba(22, 93, 255, 0.08);
  color: #165dff;
  border-left-color: #165dff;
}
.menu-item.active svg { color: #165dff; }
.sidebar-sider.collapsed .menu-item { justify-content: center; padding: 10px 0; }
.sidebar-sider.collapsed .menu-item span { display: none; }

/* 主内容区 */
.main-content {
  flex: 1;
  min-width: 0;
  margin: 60px 0 16px 220px;
  padding: 0 16px;
  display: flex;
  flex-direction: column;
  height: calc(100vh - 60px);
  overflow: hidden;
  transition: margin 0.2s;
}
.sidebar-sider.collapsed ~ .main-content { margin-left: 48px; }

/* 标题卡片 */
.title-card {
  background: #ffffff;
  border-radius: 4px;
  padding: 8px 24px;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 16px;
  height: 86px;
}
.title-image {
  width: 100px; height: 70px;
  flex-shrink: 0;
}
.title-image img {
  width: 100%; height: 100%;
  object-fit: cover;
  border-radius: 2px;
}
.title-content { display: flex; flex-direction: column; justify-content: center; }
.title {
  font-family: 'PingFang SC', sans-serif;
  font-size: 24px;
  color: #165dff;
  font-style: italic;
  margin: 0 0 4px 0;
  font-weight: normal;
}
.subtitle { font-size: 14px; color: #1d2129; margin: 0; }

/* 查询卡片 */
.query-card {
  background: #ffffff;
  border-radius: 4px;
  padding: 11px 20px 31px;
  min-width: 0;
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.query-title {
  font-size: 16px;
  font-weight: 500;
  color: #1d2129;
  margin-bottom: 20px;
}
.query-form { padding-left: 0; }
.form-row {
  display: flex; align-items: center;
  margin-bottom: 12px;
}
.form-item {
  display: flex; align-items: center;
  width: 100%; flex: 1;
}
.form-label {
  width: 98px;
  font-size: 14px;
  color: #1d2129;
  line-height: 32px;
  flex-shrink: 0;
}
.required { color: #f53f3f; margin-right: 2px; }

/* 自定义 Radio */
.env-radio-group { display: flex; gap: 24px; }
.radio-wrapper {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  font-size: 14px;
  color: #1d2129;
  user-select: none;
}
.radio-wrapper input { display: none; }
.radio-circle {
  width: 16px; height: 16px;
  border-radius: 50%;
  border: 1px solid #c9cdd4;
  display: flex; align-items: center; justify-content: center;
  background: #fff;
  transition: all 0.2s;
}
.radio-wrapper input:checked + .radio-circle {
  border-color: #165dff;
  border-width: 4.5px;
}

/* 自定义 Select */
.category-select {
  position: relative;
  width: 100%;
  max-width: 800px;
}
.select-trigger {
  min-height: 32px;
  padding: 4px 12px;
  border: 1px solid #c9cdd4;
  border-radius: 2px;
  background: #fff;
  cursor: pointer;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 4px;
  font-size: 14px;
}
.select-trigger:hover { border-color: #165dff; }
.select-trigger.open { border-color: #165dff; }
.select-placeholder { color: #c9cdd4; }
.select-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 1px 8px;
  background: #f2f3f5;
  border-radius: 2px;
  font-size: 12px;
  color: #1d2129;
}
.select-tag .close {
  cursor: pointer;
  color: #86909c;
  font-size: 14px;
  line-height: 1;
}
.select-arrow {
  margin-left: auto;
  color: #86909c;
  transition: transform 0.2s;
}
.select-trigger.open .select-arrow { transform: rotate(180deg); }

.select-dropdown {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  width: 100%;
  max-width: 800px;
  background: #fff;
  border: 1px solid #e5e6eb;
  border-radius: 2px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.08);
  z-index: 200;
  display: none;
}
.select-dropdown.open { display: block; }
.select-header, .select-footer {
  padding: 14px 16px;
  display: flex;
  align-items: center;
  background: #fafbfc;
}
.select-header { border-bottom: 1px solid #e5e6eb; justify-content: space-between; }
.select-footer { border-top: 1px solid #e5e6eb; justify-content: flex-end; gap: 12px; }

.checkbox-wrapper {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  font-size: 14px;
  user-select: none;
}
.checkbox-wrapper input { display: none; }
.checkbox-box {
  width: 16px; height: 16px;
  border-radius: 2px;
  border: 1px solid #c9cdd4;
  background: #fff;
  display: flex; align-items: center; justify-content: center;
  color: #fff;
  font-size: 12px;
  transition: all 0.2s;
}
.checkbox-wrapper.indeterminate .checkbox-box,
.checkbox-wrapper.checked .checkbox-box {
  background: #165dff;
  border-color: #165dff;
}
.header-tip { font-size: 13px; color: #4e5969; }

.select-options {
  max-height: 260px;
  overflow-y: auto;
}
.select-option {
  padding: 8px 16px;
  cursor: pointer;
  font-size: 14px;
  color: #1d2129;
  display: flex;
  align-items: center;
  gap: 8px;
}
.select-option:hover { background: #f2f3f5; }
.select-option.selected { background: #f2f3f5; color: #165dff; }
.select-option .checkbox-box {
  width: 14px; height: 14px;
  font-size: 10px;
}
.select-empty {
  padding: 16px;
  text-align: center;
  color: #86909c;
  font-size: 13px;
}

/* 自定义按钮 */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 0 16px;
  height: 32px;
  border-radius: 2px;
  font-size: 14px;
  border: 1px solid transparent;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
}
.btn-primary {
  background: #165dff;
  border-color: #165dff;
  color: #fff;
}
.btn-primary:hover { background: #0e4ddb; }
.btn-secondary {
  background: #fff;
  border-color: #c9cdd4;
  color: #1d2129;
}
.btn-secondary:hover { border-color: #165dff; color: #165dff; }
.btn-text { background: transparent; color: #1d2129; }
.btn-text:hover { background: #f2f3f5; }
.btn-sm { height: 28px; padding: 0 14px; font-size: 13px; }

.form-actions {
  display: flex; gap: 8px;
  margin-top: 16px;
  padding-left: 98px;
}
.search-btn { background: #165dff !important; border-color: #165dff !important; }
.search-btn svg { font-size: 14px; }
.reset-btn { color: #4e5969; }

/* 表格 */
.table-container {
  margin-top: 20px;
  border: 1px solid #e5e6eb;
  border-radius: 2px;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  flex: 1;
  overflow: hidden;
}
.table-scroll {
  flex: 1;
  overflow: auto;
  min-height: 0;
}
.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}
.data-table thead th {
  background: #f2f3f5;
  font-weight: 500;
  color: #1d2129;
  padding: 10px 12px;
  text-align: left;
  border: 1px solid #e5e6eb;
  white-space: nowrap;
  position: sticky;
  top: 0;
  z-index: 1;
}
.data-table tbody td {
  color: #1d2129;
  padding: 10px 12px;
  border: 1px solid #e5e6eb;
  white-space: nowrap;
  max-width: 280px;
  overflow: hidden;
  text-overflow: ellipsis;
}
.data-table tbody tr:nth-child(even) td { background: #fafbfc; }
.data-table tbody tr:hover td { background: #f2f3f5; }
.data-table tbody tr:hover:nth-child(even) td { background: #f2f3f5; }
.col-index { width: 80px; text-align: center; }
.col-category { width: 160px; }
.col-model { width: 270px; }
.col-spu { width: 140px; }
.col-supplier { width: 180px; }
.col-price { width: 100px; color: #165dff; }
.col-action { width: 100px; text-align: center; }
.action-btn {
  color: #165dff;
  cursor: pointer;
  font-size: 14px;
}
.action-btn:hover { text-decoration: underline; }

/* 分页 */
.pagination-container {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  padding: 12px 16px;
  background: #ffffff;
  border-top: 1px solid #e5e6eb;
  flex-shrink: 0;
}
.pagination-info { font-size: 14px; color: #1d2129; }
.pagination { display: flex; align-items: center; gap: 8px; }
.page-btn, .page-number {
  display: flex; align-items: center; justify-content: center;
  min-width: 24px; height: 24px;
  padding: 0 4px;
  border-radius: 2px;
  cursor: pointer;
  font-size: 14px;
  color: #4e5969;
  transition: all 0.2s;
  user-select: none;
}
.page-btn:hover:not(.disabled), .page-number:hover:not(.ellipsis) { background: #f2f3f5; }
.page-number.active { background: #e8f3ff; color: #165dff; }
.page-btn.disabled { opacity: 0.5; cursor: not-allowed; }
.page-size-selector {
  display: flex; align-items: center; gap: 4px;
  padding: 4px 12px;
  background: #f2f3f5;
  border-radius: 2px;
  font-size: 14px;
  color: #1d2129;
  margin-left: 8px;
  cursor: pointer;
}
.page-size-selector svg { font-size: 12px; }

/* 折叠按钮 */
.collapse-trigger {
  position: fixed;
  top: 60px;
  left: 220px;
  width: 16px;
  height: 32px;
  background: #fff;
  border: 1px solid #e5e6eb;
  border-left: none;
  border-radius: 0 2px 2px 0;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  z-index: 51;
  color: #4e5969;
  transition: left 0.2s;
}
.collapse-trigger.collapsed { left: 48px; }
.collapse-trigger:hover { color: #165dff; }
</style>

// 简易 h 函数
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'class') el.className = v;
      else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
      else if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k === 'html') el.innerHTML = v;
      else if (v !== null && v !== undefined && v !== false) el.setAttribute(k, v);
    }
  }
  for (const c of children.flat()) {
    if (c === null || c === undefined || c === false) continue;
    el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return el;
}

// Icon 渲染函数
function renderIcon(name, size = 14) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('width', size);
  svg.setAttribute('height', size);
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('fill', 'currentColor');
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('d', ICONS[name] || ICONS.apps);
  svg.appendChild(path);
  return svg;
}

function visiblePages() {
  const totalPages = Math.ceil(TOTAL / PAGE_SIZE);
  const current = state.currentPage;
  const pages = [];
  if (totalPages <= 7) {
    for (let i = 1; i <= totalPages; i++) pages.push(i);
  } else if (current <= 4) {
    for (let i = 1; i <= 5; i++) pages.push(i);
    pages.push('...'); pages.push(totalPages);
  } else if (current >= totalPages - 3) {
    pages.push(1); pages.push('...');
    for (let i = totalPages - 4; i <= totalPages; i++) pages.push(i);
  } else {
    pages.push(1); pages.push('...');
    for (let i = current - 1; i <= current + 1; i++) pages.push(i);
    pages.push('...'); pages.push(totalPages);
  }
  return pages;
}

    alert('查询条件：\n环境：' + (state.environment === 'test' ? '测试环境' : '生产环境') + '\n类目数：' + state.selectedCategories.length);
  });
  actions.appendChild(searchBtn);

  const resetBtn = h('button', { class: 'btn btn-secondary reset-btn' });
  resetBtn.appendChild(renderIcon('refresh', 14));
  resetBtn.appendChild(document.createTextNode('重置'));
  resetBtn.addEventListener('click', () => {
    state.environment = 'test';
    state.selectedCategories = [];
    state.currentPage = 1;
    render();
  });
  actions.appendChild(resetBtn);
  form.appendChild(actions);

  card.appendChild(form);
  card.appendChild(renderTable());
  return card;
}

function renderCategorySelect() {
  const wrap = h('div', { class: 'category-select' });

  // trigger
  const trigger = h('div', {
    class: 'select-trigger' + (state.selectOpen ? ' open' : ''),
    onClick: (e) => { e.stopPropagation(); state.selectOpen = !state.selectOpen; render(); }
  });

  if (state.selectedCategories.length === 0) {
    trigger.appendChild(h('span', { class: 'select-placeholder' }, '请选择'));
  } else {
    state.selectedCategories.slice(0, 3).forEach(c => {
      const tag = h('span', { class: 'select-tag' }, c);
      const close = h('span', { class: 'close' });
      close.appendChild(renderIcon('close', 10));
      close.addEventListener('click', (e) => {
        e.stopPropagation();
        state.selectedCategories = state.selectedCategories.filter(x => x !== c);
        render();
      });
      tag.appendChild(close);
      trigger.appendChild(tag);
    });
    if (state.selectedCategories.length > 3) {
      trigger.appendChild(h('span', { class: 'select-tag' }, '+' + (state.selectedCategories.length - 3) + '...'));
    }
  }
  const arrowWrap = h('span', { class: 'select-arrow' });
  arrowWrap.appendChild(renderIcon('down', 12));
  trigger.appendChild(arrowWrap);
  wrap.appendChild(trigger);

  // dropdown
  const dropdown = h('div', {
    class: 'select-dropdown' + (state.selectOpen ? ' open' : ''),
    onClick: (e) => e.stopPropagation()
  });

  // header
  const header = h('div', { class: 'select-header' });
  const allChecked = state.selectedCategories.length === CATEGORY_OPTIONS.length;
  const indeterminate = state.selectedCategories.length > 0 && state.selectedCategories.length < CATEGORY_OPTIONS.length;
  const cb = h('label', { class: 'checkbox-wrapper' + (allChecked ? ' checked' : '') + (indeterminate ? ' indeterminate' : '') });
  const cbInput = h('input', { type: 'checkbox', checked: allChecked });
  const cbBox = h('span', { class: 'checkbox-box' }, allChecked || indeterminate ? '✓' : '');
  cb.appendChild(cbInput);
  cb.appendChild(cbBox);
  cb.appendChild(h('span', null, '全选'));
  cb.addEventListener('click', (e) => {
    e.preventDefault();
    if (allChecked) state.selectedCategories = [];
    else state.selectedCategories = CATEGORY_OPTIONS.slice();
    render();
  });
  header.appendChild(cb);
  header.appendChild(h('span', { class: 'header-tip' }, '已选 ' + state.selectedCategories.length + ' / ' + CATEGORY_OPTIONS.length));
  dropdown.appendChild(header);

  // options
  const optionsBox = h('div', { class: 'select-options' });
  CATEGORY_OPTIONS.forEach(opt => {
    const selected = state.selectedCategories.includes(opt);
    const optEl = h('div', { class: 'select-option' + (selected ? ' selected' : '') });
    const oCb = h('span', { class: 'checkbox-box' + (selected ? ' checked' : '') }, selected ? '✓' : '');
    optEl.appendChild(oCb);
    optEl.appendChild(h('span', null, opt));
    optEl.addEventListener('click', () => {
      if (selected) state.selectedCategories = state.selectedCategories.filter(x => x !== opt);
      else state.selectedCategories = [...state.selectedCategories, opt];
      render();
    });
    optionsBox.appendChild(optEl);
  });
  dropdown.appendChild(optionsBox);

  // footer
  const footer = h('div', { class: 'select-footer' });
  const clearBtn = h('button', { class: 'btn btn-text btn-sm' }, '清空');
  clearBtn.addEventListener('click', () => { state.selectedCategories = []; render(); });
  const closeBtn = h('button', { class: 'btn btn-primary btn-sm' }, '关闭');
  closeBtn.addEventListener('click', () => { state.selectOpen = false; render(); });
  footer.appendChild(clearBtn);
  footer.appendChild(closeBtn);
  dropdown.appendChild(footer);

  wrap.appendChild(dropdown);

  // 点击外部关闭
  setTimeout(() => {
    const handler = (e) => {
      if (!wrap.contains(e.target)) {
        if (state.selectOpen) { state.selectOpen = false; render(); }
        document.removeEventListener('click', handler);
      }
    };
    document.addEventListener('click', handler);
  }, 0);

  return wrap;
}

function renderTable() {
  const container = h('div', { class: 'table-container' });
  const scroll = h('div', { class: 'table-scroll' });

  const table = h('table', { class: 'data-table' });
  const thead = h('thead');
  const trh = h('tr');
  ['序号','类目名称','材料型号','SPU型号','供应商名称','销售价（元）','操作'].forEach((title, i) => {
    const th = h('th', {
      class: 'col-' + ['index','category','model','spu','supplier','price','action'][i]
    }, title);
    trh.appendChild(th);
  });
  thead.appendChild(trh);
  table.appendChild(thead);

  const tbody = h('tbody');
  TABLE_DATA.forEach(row => {
    const tr = h('tr');
    tr.appendChild(h('td', { class: 'col-index' }, String(row.index)));
    tr.appendChild(h('td', { class: 'col-category', title: row.categoryName }, row.categoryName));
    tr.appendChild(h('td', { class: 'col-model', title: row.model }, row.model));
    tr.appendChild(h('td', { class: 'col-spu', title: row.spuModel }, row.spuModel));
    tr.appendChild(h('td', { class: 'col-supplier', title: row.supplier }, row.supplier));
    tr.appendChild(h('td', { class: 'col-price' }, formatPrice(row.price)));
    const actionTd = h('td', { class: 'col-action' });
    const actionBtn = h('span', { class: 'action-btn' }, '选用');
    actionBtn.addEventListener('click', () => {
      alert('已选用：\n' + row.categoryName + '\n型号：' + row.model + '\n供应商：' + row.supplier + '\n价格：¥' + formatPrice(row.price));
    });
    actionTd.appendChild(actionBtn);
    tr.appendChild(actionTd);
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  scroll.appendChild(table);
  container.appendChild(scroll);
  container.appendChild(renderPagination());
  return container;
}

function renderPagination() {
  const totalPages = Math.ceil(TOTAL / PAGE_SIZE);
  const container = h('div', { class: 'pagination-container' });
  container.appendChild(h('div', { class: 'pagination-info' }, '共 ' + TOTAL + ' 条'));

  const pg = h('div', { class: 'pagination' });

  const prev = h('div', { class: 'page-btn prev' + (state.currentPage === 1 ? ' disabled' : '') });
  prev.appendChild(renderIcon('left', 12));
  prev.addEventListener('click', () => {
    if (state.currentPage > 1) { state.currentPage--; render(); }
  });
  pg.appendChild(prev);

  visiblePages().forEach(p => {
    if (p === '...') {
      pg.appendChild(h('div', { class: 'page-number ellipsis' }, '...'));
    } else {
      const pn = h('div', {
        class: 'page-number' + (p === state.currentPage ? ' active' : ''),
        onClick: () => { state.currentPage = p; render(); }
      }, String(p));
      pg.appendChild(pn);
    }
  });

  const next = h('div', { class: 'page-btn next' + (state.currentPage === totalPages ? ' disabled' : '') });
  next.appendChild(renderIcon('right', 12));
  next.addEventListener('click', () => {
    if (state.currentPage < totalPages) { state.currentPage++; render(); }
  });
  pg.appendChild(next);

  const sizeSel = h('div', { class: 'page-size-selector' });
  sizeSel.appendChild(h('span', null, '10条/页'));
  sizeSel.appendChild(renderIcon('down', 12));
  pg.appendChild(sizeSel);

  container.appendChild(pg);
  return container;
}

// 启动
render();
</script>
</body>
</html>
